<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz 5 - Conhecimentos Gerais</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #0d1b2a;
            color: #f0ead6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .quiz-container {
            background: rgba(0,0,0,0.4);
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #d4a373;
        }
        .btn-opcao {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #3a5a7a;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        .correct { background: #28a745 !important; }
        .wrong { background: #dc3545 !important; }

        #trofeu-container {
            display: none;
            animation: pop 0.6s cubic-bezier(0.17, 0.89, 0.32, 1.49);
            margin: 20px 0;
        }
        @keyframes pop {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .stars {
            color: #ffd700;
            font-size: 25px;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        footer {
            font-family: Arial Black;
            font-size: 16px;
            color: #d4a373;
            margin-top: 30px;
            text-transform: uppercase;
        }
        h2 {
            color: #87ceeb;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-content">
        <h2 id="pergunta"></h2>
        <div id="opcoes"></div>
    </div>

    <div id="trofeu-container">
        <div class="stars">★ ★ ★</div>
        <div style="font-size:80px;">🏆</div>
        <h2 style="color:#ffd700;">QUALIFICACAO MAXIMA!</h2>
        <p>Voce concluiu todas as etapas do quiz.</p>
        <a href="quiz_curiosidades.html"
           class="btn-opcao"
           style="background:#28a745;text-decoration:none;">
           AVANCAR
        </a>
    </div>

    <footer>GILBERTO MOREIRA</footer>
</div>

<script>
const perguntas = [
    // CONHECIMENTO GERAL / RACIOCINIO
    { q: "Quantos planetas existem no sistema solar?", o: ["7", "8", "9"], r: "8" },
    { q: "Qual continente possui mais paises?", o: ["Asia", "Africa", "Europa"], r: "Africa" },
    { q: "Qual e o maior mamifero do mundo?", o: ["Elefante", "Baleia Azul", "Girafa"], r: "Baleia Azul" },

    // CIENCIA E CORPO HUMANO
    { q: "Qual orgao e responsavel pela respiracao?", o: ["Coracao", "Pulmao", "Figado"], r: "Pulmao" },
    { q: "Qual vitamina o corpo produz ao receber luz solar?", o: ["Vitamina A", "Vitamina C", "Vitamina D"], r: "Vitamina D" },
    { q: "Qual tipo de sangue e considerado doador universal?", o: ["AB+", "O-", "A+"], r: "O-" },

    // HISTORIA / SOCIEDADE
    { q: "Quem proclamou a Independencia do Brasil?", o: ["Dom Pedro I", "Tiradentes", "Dom Joao VI"], r: "Dom Pedro I" },
    { q: "Em que ano ocorreu a Revolucao Francesa?", o: ["1789", "1808", "1848"], r: "1789" },
    { q: "Qual pais criou a imprensa moderna?", o: ["Franca", "Alemanha", "Italia"], r: "Alemanha" },

    // LOGICA SIMPLES
    { q: "Quanto e 7 x 8?", o: ["54", "56", "64"], r: "56" }
];

let indice = 0;
let acertos = 0;

function carregar() {
    const p = perguntas[indice];
    document.getElementById("pergunta").innerText = p.q;
    const box = document.getElementById("opcoes");
    box.innerHTML = "";

    p.o.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "btn-opcao";
        btn.innerText = opt;
        btn.onclick = () => {
            document.querySelectorAll(".btn-opcao").forEach(b => b.disabled = true);
            if (opt === p.r) {
                btn.classList.add("correct");
                acertos++;
            } else {
                btn.classList.add("wrong");
            }
            setTimeout(proxima, 800);
        };
        box.appendChild(btn);
    });
}

function proxima() {
    indice++;
    if (indice < perguntas.length) {
        carregar();
    } else {
        document.getElementById("quiz-content").style.display = "none";
        if (acertos === perguntas.length) {
            document.getElementById("trofeu-container").style.display = "block";
        } else {
            document.getElementById("quiz-content").innerHTML = `
                <h2>Fim da Etapa</h2>
                <p>Voce acertou ${acertos}/10.</p>
                <a href="quiz_curiosidades.html"
                   class="btn-opcao"
                   style="background:#28a745;text-decoration:none;">
                   AVANCAR
                </a>
            `;
            document.getElementById("quiz-content").style.display = "block";
        }
    }
}

carregar();
</script>
</body>
</html>
