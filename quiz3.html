<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz 3 - Conhecimentos Gerais</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #0d1b2a;
            color: #f0ead6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .quiz-container {
            background: rgba(0,0,0,0.4);
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #d4a373;
        }
        .btn-opcao {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #3a5a7a;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        .correct { background: #28a745 !important; }
        .wrong { background: #dc3545 !important; }

        #trofeu-container {
            display: none;
            animation: pop 0.6s cubic-bezier(0.17, 0.89, 0.32, 1.49);
            margin: 20px 0;
        }
        @keyframes pop {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .stars {
            color: #ffd700;
            font-size: 25px;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        footer {
            font-family: Arial Black;
            font-size: 16px;
            color: #d4a373;
            margin-top: 30px;
            text-transform: uppercase;
        }
        h2 {
            color: #87ceeb;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-content">
        <h2 id="pergunta"></h2>
        <div id="opcoes"></div>
    </div>

    <div id="trofeu-container">
        <div class="stars">★ ★ ★</div>
        <div style="font-size:80px;">🏆</div>
        <h2 style="color:#ffd700;">QUALIFICACAO MAXIMA!</h2>
        <p>Excelente desempenho nesta etapa.</p>
        <a href="quiz4.html"
           class="btn-opcao"
           style="background:#28a745;text-decoration:none;">
           AVANCAR
        </a>
    </div>

    <footer>GILBERTO MOREIRA</footer>
</div>

<script>
const perguntas = [
    // GEOGRAFIA
    { q: "Qual o maior continente do mundo?", o: ["Africa", "Asia", "America"], r: "Asia" },
    { q: "Qual pais tem o maior territorio do planeta?", o: ["Canada", "Russia", "China"], r: "Russia" },
    { q: "Qual linha imaginaria divide a Terra em hemisferio norte e sul?", o: ["Equador", "Greenwich", "Tropico"], r: "Equador" },

    // BIOLOGIA
    { q: "Qual orgao bombeia o sangue no corpo humano?", o: ["Pulmao", "Figado", "Coracao"], r: "Coracao" },
    { q: "Qual gas e essencial para a respiracao humana?", o: ["Nitrogenio", "Oxigenio", "Carbono"], r: "Oxigenio" },
    { q: "Qual parte da celula contem o material genetico?", o: ["Membrana", "Nucleo", "Citoplasma"], r: "Nucleo" },

    // HISTORIA
    { q: "Em que ano o Brasil foi oficialmente descoberto?", o: ["1492", "1500", "1530"], r: "1500" },
    { q: "Quem foi o primeiro presidente do Brasil?", o: ["Deodoro da Fonseca", "Getulio Vargas", "Floriano Peixoto"], r: "Deodoro da Fonseca" },
    { q: "Qual civilizacao construiu as piramides do Egito?", o: ["Gregos", "Romanos", "Egipcios"], r: "Egipcios" },
    { q: "A Segunda Guerra Mundial terminou em que ano?", o: ["1942", "1945", "1950"], r: "1945" }
];

let indice = 0;
let acertos = 0;

function carregar() {
    const p = perguntas[indice];
    document.getElementById("pergunta").innerText = p.q;
    const box = document.getElementById("opcoes");
    box.innerHTML = "";

    p.o.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "btn-opcao";
        btn.innerText = opt;
        btn.onclick = () => {
            document.querySelectorAll(".btn-opcao").forEach(b => b.disabled = true);
            if (opt === p.r) {
                btn.classList.add("correct");
                acertos++;
            } else {
                btn.classList.add("wrong");
            }
            setTimeout(proxima, 800);
        };
        box.appendChild(btn);
    });
}

function proxima() {
    indice++;
    if (indice < perguntas.length) {
        carregar();
    } else {
        document.getElementById("quiz-content").style.display = "none";
        if (acertos === perguntas.length) {
            document.getElementById("trofeu-container").style.display = "block";
        } else {
            document.getElementById("quiz-content").innerHTML = `
                <h2>Fim da Etapa</h2>
                <p>Voce acertou ${acertos}/10.</p>
                <a href="quiz4.html"
                   class="btn-opcao"
                   style="background:#28a745;text-decoration:none;">
                   AVANCAR
                </a>
            `;
            document.getElementById("quiz-content").style.display = "block";
        }
    }
}

carregar();
</script>
</body>
</html>
